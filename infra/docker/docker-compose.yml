version: "3.8"

services:
  # 1. PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tradly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradly
      POSTGRES_PASSWORD: tradlypassword
      POSTGRES_DB: tradly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradly -d tradly"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Hot Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: tradly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Tradly FastAPI Gateway
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: tradly_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://tradly:tradlypassword@postgres:5432/tradly
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tradly-docker-secret-key-min-32-characters}
      OANDA_API_KEY: ${OANDA_API_KEY}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Tradly Web Terminal (Next.js 14)
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: tradly_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/stream
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
